<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e6b5c">
    <meta name="description" content="JAIST Shuttle next bus lookup PWA">
    <title>JAIST Shuttle Next</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">JAIST Shuttle</p>
          <h1 data-i18n="appTitle">次のバス</h1>
        </div>
        <div class="topbar-actions">
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" data-language="ja" class="is-selected">日本語</button>
            <button type="button" data-language="en">EN</button>
            <button type="button" data-language="zh">中文</button>
          </div>
          <div class="clock" aria-live="polite">
            <span id="todayLabel">--</span>
            <strong id="clockLabel">--:--</strong>
          </div>
        </div>
      </header>

      <nav class="tabs" aria-label="Main navigation" data-i18n-aria-label="mainNav">
        <button class="tab is-active" type="button" data-view="home" data-i18n="tabs.home">次のバス</button>
        <button class="tab" type="button" data-view="settings" data-i18n="tabs.settings">よく使う</button>
        <button class="tab" type="button" data-view="timetable" data-i18n="tabs.timetable">時刻表</button>
      </nav>

      <main>
        <section id="homeView" class="view is-active" aria-labelledby="homeTitle">
          <div class="status-panel">
            <div>
              <p class="section-kicker" data-i18n="home.serviceKicker">運行日</p>
              <h2 id="homeTitle" data-i18n="home.loading">自動判定中</h2>
            </div>
            <div class="segmented" role="group" aria-label="Service override" data-i18n-aria-label="home.serviceOverride">
              <button type="button" data-service-override="auto" class="is-selected" data-i18n="override.auto">自動</button>
              <button type="button" data-service-override="weekday" data-i18n="service.weekday">平日</button>
              <button type="button" data-service-override="satSunHoliday" data-i18n="service.satSunHoliday">土日祝</button>
            </div>
          </div>

          <div id="favoritesList" class="favorite-list" aria-live="polite"></div>
        </section>

        <section id="settingsView" class="view" aria-labelledby="settingsTitle">
          <div class="section-header">
            <p class="section-kicker" data-i18n="settings.kicker">よく使う停留所</p>
            <h2 id="settingsTitle" data-i18n="settings.title">停留所と方面</h2>
          </div>

          <form id="favoriteForm" class="settings-form">
            <label>
              <span data-i18n="forms.stop">停留所</span>
              <select id="stopSelect" required></select>
            </label>
            <label>
              <span data-i18n="forms.direction">方面</span>
              <select id="directionSelect" required></select>
            </label>
            <label>
              <span data-i18n="forms.note">メモ</span>
              <input id="nicknameInput" type="text" maxlength="20" placeholder="例：朝の通学" data-i18n-placeholder="forms.notePlaceholder">
            </label>
            <button class="primary-action" type="submit" data-i18n="forms.addFavorite">追加</button>
          </form>

          <div id="settingsList" class="manage-list"></div>
        </section>

        <section id="timetableView" class="view" aria-labelledby="timetableTitle">
          <div class="section-header">
            <p class="section-kicker" data-i18n="timetable.kicker">鶴来線</p>
            <h2 id="timetableTitle" data-i18n="timetable.title">全時刻表</h2>
          </div>

          <div class="table-controls">
            <label>
              <span data-i18n="forms.direction">方面</span>
              <select id="tableDirectionSelect"></select>
            </label>
            <label>
              <span data-i18n="forms.serviceDay">運行日</span>
              <select id="tableServiceSelect"></select>
            </label>
          </div>

          <div id="timetableMeta" class="source-note"></div>
          <div id="timetableTable" class="table-wrap"></div>
        </section>
      </main>
    </div>

    <template id="emptyFavoritesTemplate">
      <div class="empty-state">
        <h2 data-i18n="empty.title">よく使う停留所がありません</h2>
        <p data-i18n="empty.body">追加すると、ホームに次のバスと後続便が表示されます。</p>
        <button class="primary-action" type="button" data-open-settings data-i18n="empty.action">停留所を追加</button>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
